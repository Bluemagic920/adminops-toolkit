<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdminOps Password Generator</title><style>:root{color-scheme:dark}body{font:16px system-ui,Segoe UI,sans-serif;background:#101827;color:#f0f5ff;max-width:740px;margin:3rem auto;padding:0 1rem}main{background:#1a2638;border:1px solid #34465c;border-radius:16px;padding:24px}h1{margin-top:0}label{display:block;margin:15px 0}input[type=number]{width:80px;padding:9px;background:#0c1421;color:white;border:1px solid #789;border-radius:6px}input[type=checkbox]{accent-color:#60b9ff}button{background:#55aef1;border:0;color:#081827;font-weight:700;padding:12px 18px;border-radius:8px;cursor:pointer;margin:8px 8px 8px 0}button:focus-visible,input:focus-visible{outline:3px solid #fff}#password{width:100%;box-sizing:border-box;background:#0b1421;color:#fff;border:1px solid #789;border-radius:8px;padding:14px;font:16px Consolas,monospace}small{color:#b7c5d9}#status{min-height:1.5em}</style></head><body><main><h1>AdminOps Password Generator</h1><p>Generate passwords locally in your browser. No account or server connection required.</p><label>Password length <input id="length" type="number" min="12" max="128" value="24"></label><label><input id="upper" type="checkbox" checked> Uppercase letters</label><label><input id="lower" type="checkbox" checked> Lowercase letters</label><label><input id="digits" type="checkbox" checked> Numbers</label><label><input id="symbols" type="checkbox" checked> Symbols</label><label for="password">Generated password</label><input id="password" type="text" readonly spellcheck="false" autocomplete="off" aria-label="Generated password"><div><button id="generate">Generate password</button><button id="copy">Copy password</button></div><p id="status" role="status" aria-live="polite"></p><small>Uses your browser's cryptographically secure random generator. Avoid saving passwords in screenshots or unsecured notes. Clipboard contents may remain available to other applications.</small></main><script>
'use strict';
const $=id=>document.getElementById(id);
const groups=[['upper','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['lower','abcdefghijklmnopqrstuvwxyz'],['digits','0123456789'],['symbols','!@#$%^&*()-_=+[]{};:,.?/']];
function secureInt(n){if(!Number.isSafeInteger(n)||n<1||n>65536)throw Error('Invalid random range');const range=0x100000000;const limit=Math.floor(range/n)*n;const b=new Uint32Array(1);let x;do{crypto.getRandomValues(b);x=b[0]}while(x>=limit);return x%n}
function pick(s){return s[secureInt(s.length)]}
function generate(){try{if(!globalThis.crypto?.getRandomValues)throw Error('Secure randomness unavailable');const len=Number($('length').value);if(!Number.isInteger(len)||len<12||len>128)throw Error('Choose a length from 12 to 128');const selected=groups.filter(([id])=>$(id).checked).map(([,chars])=>chars);if(!selected.length)throw Error('Select at least one character type');const alphabet=selected.join('');const chars=selected.map(pick);while(chars.length<len)chars.push(pick(alphabet));for(let i=chars.length-1;i>0;i--){const j=secureInt(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]} $('password').value=chars.join('');$('status').textContent='New password generated locally.'}catch(e){$('password').value='';$('status').textContent=e.message}}
$('generate').addEventListener('click',generate);$('copy').addEventListener('click',async()=>{if(!$('password').value){$('status').textContent='Generate a password first.';return}try{await navigator.clipboard.writeText($('password').value);$('status').textContent='Copied. Clear your clipboard when finished.'}catch{$('status').textContent='Clipboard unavailable. Select and copy the password manually.'}});generate();
</script></body></html>
